name: serverless-3tier CI

# CI for the serverless-3tier POC template (examples/serverless-3tier/).
#
# Scope: lint/build/synth/test only. This template is never deployed — see
# .claude/specs/serverless-3tier/spec.md (NF1) and design.md. There is
# deliberately no deploy job, no AWS credentials, and no secrets:: reference
# anywhere in this file. `cdk synth` succeeds with no AWS account because the
# stacks are environment-agnostic (no explicit `env`, no context lookups).
#
# DEGRADES WHEN THE TEMPLATE IS ABSENT. push/pull_request are path-filtered on
# examples/serverless-3tier/**, but workflow_dispatch is not — so this workflow
# can be invoked on a tree where that directory does not exist (it currently
# does not). It previously set `working-directory: examples/serverless-3tier` at
# workflow level, which applies to every run step in BOTH jobs and made such a
# run fail immediately on `npm ci` (cannot chdir). The directory is now scoped
# per step and every step is guarded on its presence, matching what the web/ job
# already did.

on:
  push:
    branches: [main]
    paths:
      - "examples/serverless-3tier/**"
      - ".github/workflows/serverless-3tier.yml"
  pull_request:
    paths:
      - "examples/serverless-3tier/**"
      - ".github/workflows/serverless-3tier.yml"
  workflow_dispatch: {}

concurrency:
  group: serverless-3tier-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # No AWS_* variables are set here on purpose — synth must succeed with
  # zero AWS credentials present (NF1).
  CI: "true"

jobs:
  infra:
    name: Build, synth, and test the CDK app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runs from the repo root on purpose: it has to be able to report that the
      # template directory is missing, which it could not do from inside it.
      - name: Check for the serverless-3tier template
        id: check-template
        run: |
          if [ -f "examples/serverless-3tier/package.json" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # setup-node resolves node-version-file from the workspace root, so it
      # fails on a missing .nvmrc regardless of any working-directory — it needs
      # the same guard as the run steps.
      - name: Set up Node
        if: steps.check-template.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: examples/serverless-3tier/.nvmrc
          cache: npm
          cache-dependency-path: examples/serverless-3tier/package-lock.json

      - name: Install dependencies (root app)
        if: steps.check-template.outputs.present == 'true'
        working-directory: examples/serverless-3tier
        run: npm ci

      - name: Type-check
        if: steps.check-template.outputs.present == 'true'
        working-directory: examples/serverless-3tier
        run: npm run build

      - name: cdk synth (offline — no AWS credentials provided)
        if: steps.check-template.outputs.present == 'true'
        working-directory: examples/serverless-3tier
        run: npm run synth

      - name: Unit tests (stack assertions, handler tests, cdk-nag suite)
        if: steps.check-template.outputs.present == 'true'
        working-directory: examples/serverless-3tier
        run: npm test

      - name: Template not present yet
        if: steps.check-template.outputs.present != 'true'
        run: echo "::notice::examples/serverless-3tier/package.json not found; skipping the CDK build."

  web:
    name: Build the SPA stub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The web/ SPA is a separate npm project (its own package.json and
      # lock file) built concurrently by another workstream. Guard on its
      # presence so this workflow stays green at every intermediate commit
      # of the template instead of hard-failing until that work lands.
      - name: Check for web/ SPA project
        id: check-web
        run: |
          if [ -f "examples/serverless-3tier/web/package.json" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.check-web.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: examples/serverless-3tier/.nvmrc

      - name: Install web/ dependencies
        if: steps.check-web.outputs.present == 'true'
        working-directory: examples/serverless-3tier/web
        run: npm ci

      - name: vite build
        if: steps.check-web.outputs.present == 'true'
        working-directory: examples/serverless-3tier/web
        run: npm run build

      - name: web/ project not present yet
        if: steps.check-web.outputs.present != 'true'
        run: echo "::notice::examples/serverless-3tier/web/package.json not found yet; skipping SPA build step."
