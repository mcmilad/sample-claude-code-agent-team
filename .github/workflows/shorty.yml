name: shorty CI

# CI for the Shorty backend-only serverless URL shortener (apps/shorty/).
#
# Scope: lint/synth/test only. This app is never deployed by the agent team --
# see .claude/specs/shorty/spec.md (NF1) and design.md. There is deliberately
# no deploy job, no AWS credentials step, and no reference to any secret store
# or secret value anywhere in this file. `cdk synth` succeeds with no AWS
# account because the stacks are environment-agnostic (no explicit `env`, no
# context lookups) -- see apps/shorty/app.py.

on:
  push:
    branches: [main]
    paths:
      - "apps/shorty/**"
      - ".github/workflows/shorty.yml"
  pull_request:
    paths:
      - "apps/shorty/**"
      - ".github/workflows/shorty.yml"
  workflow_dispatch: {}

concurrency:
  group: shorty-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # No AWS_* variables are set here on purpose -- synth must succeed with
  # zero AWS credentials present (NF1).
  CI: "true"

jobs:
  build:
    name: Lint, test, and synth the Shorty CDK app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/shorty
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: apps/shorty/.python-version
          cache: "pip"
          cache-dependency-path: |
            apps/shorty/requirements.txt
            apps/shorty/requirements-dev.txt

      - name: Set up Node (CDK CLI is Node-based)
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"

      - name: Create virtualenv and install dependencies
        run: |
          python3 -m venv .venv
          ./.venv/bin/pip install -q -r requirements.txt -r requirements-dev.txt

      - name: ruff check
        run: ./.venv/bin/ruff check .

      - name: pytest
        run: ./.venv/bin/pytest

      - name: cdk synth (offline -- no AWS credentials provided)
        run: npx --yes aws-cdk@2 synth --quiet
